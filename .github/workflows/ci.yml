# ============================================================
# La red que faltaba.
#
# 58 commits y 30 fallos documentados sin una sola verificación automática: las
# comprobaciones existían, pero dependían de que alguien se acordara de
# correrlas. Esto las convierte en una garantía.
#
# Cada paso va por separado y con `!cancelled()` en lugar de encadenados: con
# `npm run check` en un solo paso —que es como empezó— el primer fallo tapaba a
# los demás, y el primer run rojo dejó el build y el humo de rutas SIN EJECUTAR.
# Un run tiene que contar el estado entero, no el primer síntoma. Cuesta un
# minuto de más y ahorra la ronda de ida y vuelta.
#
# `npm run check` sigue existiendo para correrlo en local de un tirón.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela el run anterior: no tiene sentido
# pagar por verificar un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explícito, para que el fichero no dependa del ajuste de plataforma (que hoy
# también dice «read», pero no se ve en ningún diff).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA (OpenSSF): una etiqueta se puede reapuntar; un commit no.
      # Dependabot las sigue actualizando y mantiene el comentario con la versión.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        id: deps
        run: npm ci

      # Un CVE crítico en `next` vivió en el lockfile sin que nada lo dijera:
      # Dependabot estaba apagado y nadie corre `npm audit` a mano. Solo
      # dependencias de producción y solo alto/crítico: un aviso «moderate» en
      # una herramienta de desarrollo no puede poner el CI en rojo.
      - name: Vulnerabilidades conocidas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint

      - name: Tipos
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx tsc --noEmit

      # `scripts/` estaba excluido de tsc: el único código que fabrica artefactos
      # publicados (los .tex, los PDF, la figura del atlas, las comprobaciones)
      # era el único sin tipar. FALLO-32 vivió meses ahí, y en la sesión 19 el
      # generador leyó `dict.hire` donde era `dict.sheet.hire` sin que tsc lo viera.
      - name: Tipos de los scripts
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:scripts

      # Pruebas de la lógica con estado que ya rompió algo o puede romperlo en
      # silencio: la regex de CountUp sobre los valores reales, la derivación de
      # las cifras del laboratorio, las series del gráfico de crédito y la caída
      # a la instantánea. node --test, sin framework.
      - name: Pruebas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test

      # Los dos huecos que `tsc` no ve: longitudes de array y cadenas vacías.
      - name: Paridad del diccionario
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:dict

      # El PDF del CV tiene que mencionar el host de SITE. Un PDF es opaco y
      # `grep` no lo ve: este paso descomprime sus streams.
      - name: Artefactos del CV
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:artifacts

      # Más fuerte que mirar el contenido: si alguien editó el bloque `cv` del
      # diccionario y no corrió `npm run latex`, el .tex regenerado difiere del
      # versionado y esto lo dice.
      # Las cifras no pueden contradecirse entre paginas ni entre idiomas.
      # `check:dict` compara la FORMA de es/en, nunca los valores: la portada
      # afirmo 93,4 M en su tarjeta y 62,4 M cuatro parrafos mas abajo, y las
      # tres comprobaciones pasaron en verde.
      - name: Cifras consistentes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:figures

      - name: Los .tex versionados están al día
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run latex
          git diff --exit-code -- public/*.tex

      # Mismo motivo que el paso anterior, y por el mismo fallo: al mover
      # `lib/atlas-figure.ts` a `lib/generated/` el generador siguió escribiendo
      # en la ruta vieja. `npm run atlas` habría creado un fichero huérfano y la
      # figura publicada se habría quedado congelada sin que nada se quejara.
      - name: La figura del atlas está al día
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run atlas
          git diff --exit-code -- lib/generated/atlas-figure.ts

      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build

      # El presupuesto de peso por ruta (brotli, lo que el HTML referencia). Solo
      # sube a mano y con motivo: es lo que habría dicho que el renderizador del
      # atlas bajaba con la página aunque sus datos esperaran (IR-05).
      - name: Presupuesto de peso
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:weight

      - name: Humo de rutas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npx next start -p 3000 &
          npm run check:routes

      # Lighthouse sobre tres rutas: accesibilidad y SEO al 100 son un error;
      # rendimiento y buenas prácticas avisan (varían entre runners y en
      # localhost falta el script de analítica). Config en lighthouserc.json.
      - name: Lighthouse
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
