# ============================================================
# La red que faltaba.
#
# 58 commits y 30 fallos documentados sin una sola verificación automática: las
# comprobaciones existían, pero dependían de que alguien se acordara de
# correrlas. Esto las convierte en una garantía.
#
# Cada paso va por separado y con `!cancelled()` en lugar de encadenados: con
# `npm run check` en un solo paso —que es como empezó— el primer fallo tapaba a
# los demás, y el primer run rojo dejó el build y el humo de rutas SIN EJECUTAR.
# Un run tiene que contar el estado entero, no el primer síntoma. Cuesta un
# minuto de más y ahorra la ronda de ida y vuelta.
#
# `npm run check` sigue existiendo para correrlo en local de un tirón.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela el run anterior: no tiene sentido
# pagar por verificar un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        id: deps
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint

      - name: Tipos
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx tsc --noEmit

      # Los dos huecos que `tsc` no ve: longitudes de array y cadenas vacías.
      - name: Paridad del diccionario
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:dict

      # El PDF del CV tiene que mencionar el host de SITE. Un PDF es opaco y
      # `grep` no lo ve: este paso descomprime sus streams.
      - name: Artefactos del CV
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:artifacts

      # Más fuerte que mirar el contenido: si alguien editó el bloque `cv` del
      # diccionario y no corrió `npm run latex`, el .tex regenerado difiere del
      # versionado y esto lo dice.
      # Las cifras no pueden contradecirse entre paginas ni entre idiomas.
      # `check:dict` compara la FORMA de es/en, nunca los valores: la portada
      # afirmo 93,4 M en su tarjeta y 62,4 M cuatro parrafos mas abajo, y las
      # tres comprobaciones pasaron en verde.
      - name: Cifras consistentes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:figures

      - name: Los .tex versionados están al día
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run latex
          git diff --exit-code -- public/*.tex

      # Mismo motivo que el paso anterior, y por el mismo fallo: al mover
      # `lib/atlas-figure.ts` a `lib/generated/` el generador siguió escribiendo
      # en la ruta vieja. `npm run atlas` habría creado un fichero huérfano y la
      # figura publicada se habría quedado congelada sin que nada se quejara.
      - name: La figura del atlas está al día
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run atlas
          git diff --exit-code -- lib/generated/atlas-figure.ts

      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build

      - name: Humo de rutas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npx next start -p 3000 &
          npm run check:routes
