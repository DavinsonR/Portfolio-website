# Las alertas de vulnerabilidad del repositorio estaban apagadas y `next@16.3.1`
# se quedó con un CVE crítico en el lockfile sin que nada lo dijera (sesión 18).
# Esto abre un PR por cada parche de seguridad en cuanto sale, y agrupa el resto
# en uno semanal, para que revisar dependencias sea leer un diff y no acordarse
# de correr `npm outdated`. `next` y `eslint-config-next` van fijados en exacto
# a propósito (CLAUDE.md: «esta no es la Next.js que conoces»); Dependabot los
# propone igual, y el CI decide.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # D-38: tres saltos mayores que el ecosistema todavia no admite. Se revisan a
    # mano cuando cambie la condicion de cada uno; quitar la linea es la senal.
    ignore:
      # eslint-plugin-react (dentro de eslint-config-next 16.3.6) llama a
      # context.getFilename(), que ESLint 10 elimino: el lint se cae.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.71 exige typescript >=4.8.4 <6.1.0; TS 7 rompe el lint.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Los tipos siguen al Node de ejecucion (22 en CI): tipos mas nuevos que el
      # runtime prometen API que en produccion no existe.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
